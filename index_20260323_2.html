function getUserData() {

function getRecord(type, component, questionId) {
  return allData.find(d => d.user === currentUser && d.type === type && d.component === component && d.question_id === questionId);
}

async function saveAnswer(component, questionId, answer, category, starred, tags, notes) {
  // POST to Google Sheets
  const payload = { user: currentUser, component: component, question_id: questionId, user_answer: answer, starred: starred || false, notes: notes || '', score: 0 };
  try { fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); } catch(e) {}

  const existing = getRecord('answer', component, questionId);
  if (existing) {
    const updated = { ...existing, user_answer: answer, starred: starred || existing.starred, tags: tags || existing.tags, notes: notes || existing.notes, timestamp: new Date().toISOString() };
    const r = await window.dataSdk.update(updated);
    if (r.isOk) showToast('已更新 ✓');
    return r;
  } else {
    if (allData.length >= 999) { showToast('已達儲存上限 (999)'); return; }
    const r = await window.dataSdk.create({ type: 'answer', user: currentUser, category, component, question_id: questionId, user_answer: answer, starred: starred || false, tags: tags || '', notes: notes || '', timestamp: new Date().toISOString(), score: 0 });
    if (r.isOk) showToast('已儲存 ✓');
    return r;
  }
}

async function toggleStar(component, questionId, category) {
  const existing = getRecord('answer', component, questionId);
  const isNowStarred = existing ? !existing.starred : true;
  
  // POST to Google Sheets
  const payload = { user: currentUser, component: component, question_id: questionId, user_answer: existing ? existing.user_answer : '', starred: isNowStarred, notes: existing ? existing.notes : '', score: 0 };
  try { fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); } catch(e) {}

  if (existing) {
    const r = await window.dataSdk.update({ ...existing, starred: isNowStarred });
    if (r.isOk) showToast(isNowStarred ? '已收藏 ⭐' : '已取消收藏');
  } else {
    if (allData.length >= 999) { showToast('已達儲存上限 (999)'); return; }
    const r = await window.dataSdk.create({ type: 'answer', user: currentUser, category, component, question_id: questionId, user_answer: '', starred: true, tags: '', notes: '', timestamp: new Date().toISOString(), score: 0 });
    if (r.isOk) showToast('已收藏 ⭐');
  }
}

async function saveSession() {
  const existing = allData.find(d => d.user === currentUser && d.type === 'session');

    await window.dataSdk.create({ type: 'session', user: currentUser, category: '', component: '', question_id: '', user_answer: '', starred: false, tags: '', notes: '', timestamp: now, score: 0 });

  const session = ud.find(d => d.type === 'session');

  const el = (id) => document.getElementById(id);
  if (el('stat-total')) el('stat-total').textContent = answers.length;
  if (el('stat-starred')) el('stat-starred').textContent = starred.length;

  const days = new Set(answers.map(a => a.timestamp ? a.timestamp.split('T')[0] : ''));
  if (el('stat-streak')) el('stat-streak').textContent = days.size;

  if (session && el('dash-last-time')) {
    const d = new Date(session.timestamp);
    el('dash-last-time').textContent = d.toLocaleDateString('zh-HK') + ' ' + d.toLocaleTimeString('zh-HK', { hour:'2-digit', minute:'2-digit' });

let editingVocabId = null;
function editCustomVocab(id) {
  const vocab = allData.find(d => d.__backendId === id);
  if (!vocab) return;
  editingVocabId = id;
  document.getElementById('vocab-word-input').value = vocab.question_id;
  document.getElementById('vocab-meaning-input').value = vocab.user_answer;
  document.getElementById('vocab-example-input').value = vocab.notes || '';
  document.getElementById('vocab-add-form').classList.remove('hidden');
  document.querySelector('#vocab-add-form button').textContent = '更新';
}

async function deleteCustomVocab(id) {
  const vocab = allData.find(d => d.__backendId === id);
  if (!vocab) return;
  const r = await window.dataSdk.delete(vocab);
  if (r.isOk) { showToast('已刪除 ✓'); setTimeout(renderVocab, 500); }
}

function toggleVocabAdd() {
  document.getElementById('vocab-add-form').classList.toggle('hidden');
}

async function saveCustomVocab() {
  const word = document.getElementById('vocab-word-input').value.trim();
  const meaning = document.getElementById('vocab-meaning-input').value.trim();
  const example = document.getElementById('vocab-example-input').value.trim();
  if (!word || !meaning) { showToast('請輸入詞彙同意思'); return; }
  
  if (editingVocabId) {
    const vocab = allData.find(d => d.__backendId === editingVocabId);
    if (vocab) {
      const r = await window.dataSdk.update({ ...vocab, question_id: word, user_answer: meaning, notes: example });
      if (r.isOk) {
        showToast('已更新詞彙 ✓');
        editingVocabId = null;
        document.getElementById('vocab-word-input').value = '';
        document.getElementById('vocab-meaning-input').value = '';
        document.getElementById('vocab-example-input').value = '';
        document.getElementById('vocab-add-form').classList.add('hidden');
        document.querySelector('#vocab-add-form button').textContent = '儲存';
        setTimeout(renderVocab, 500);
      }
    }
  } else {
    if (allData.length >= 999) { showToast('已達儲存上限 (999)'); return; }
    const r = await window.dataSdk.create({ type: 'answer', user: currentUser, category: 'writing', component: 'vocab_custom', question_id: word, user_answer: meaning, starred: false, tags: 'custom', notes: example, timestamp: new Date().toISOString(), score: 0 });
    
    // POST to Google Sheets
    try { fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ user: currentUser, component: 'vocab_custom', question_id: word, user_answer: meaning, starred: false, notes: example, score: 0 }) }); } catch(e) {}

    if (r.isOk) {
      showToast('已新增詞彙 ✓');
      document.getElementById('vocab-word-input').value = '';
      document.getElementById('vocab-meaning-input').value = '';
      document.getElementById('vocab-example-input').value = '';
      document.getElementById('vocab-add-form').classList.add('hidden');
      setTimeout(renderVocab, 500);
    }
  }
}

        <label class="block text-xs font-semibold text-amber-700 mb-1">💡 E — Explanation (解釋)</label>
        <textarea id="peel-e2" rows="2" class="w-full px-3 py-2 rounded-lg border border-amber-200 bg-white text-sm resize-none" placeholder="This shows that...">${peel.explanation||''}</textarea>
      </div>
      <div class="bg-rose-50 rounded-xl p-3">
        <label class="block text-xs font-semibold text-rose-700 mb-1">🔗 L — Link (總結/扣題)</label>
        <textarea id="peel-l" rows="2" class="w-full px-3 py-2 rounded-lg border border-rose-200 bg-white text-sm resize-none" placeholder="Therefore...">${peel.link||''}</textarea>
      </div>
    </div>
    <button onclick="savePart3('${item.id}')" class="w-full py-2.5 rounded-xl bg-accent text-white text-sm font-medium hover:bg-indigo-600 transition mb-4">💾 儲存 PEEL</button>
    <div class="flex gap-2">
      <button onclick="prevPart3()" class="flex-1 py-2 rounded-xl border border-gray-200 text-sm font-medium hover:bg-gray-50 transition ${currentPart3Idx===0?'opacity-30 pointer-events-none':''}">← 上一題</button>
      <button onclick="nextPart3()" class="flex-1 py-2 rounded-xl border border-gray-200 text-sm font-medium hover:bg-gray-50 transition ${currentPart3Idx===allPart3.length-1?'opacity-30 pointer-events-none':''}">下一題 →</button>
    </div>
  `;
  lucide.createIcons();
}
async function savePart3(id) {
  const peel = { point: document.getElementById('peel-p').value.trim(), evidence: document.getElementById('peel-e1').value.trim(), explanation: document.getElementById('peel-e2').value.trim(), link: document.getElementById('peel-l').value.trim() };
  if (!peel.point) { showToast('請至少寫 Point'); return; }
  await saveAnswer('part3', id, JSON.stringify(peel), 'speaking');
}
function nextPart3() { const all = [...PART3_DATA, ...(customQuestions.part3 || [])]; if (currentPart3Idx < all.length - 1) { currentPart3Idx++; renderPart3(); } }
function prevPart3() { if (currentPart3Idx > 0) { currentPart3Idx--; renderPart3(); } }

// ========== REVIEW SCREEN ==========
let reviewEditingId = null;
let reviewEditingType = null;
let selectedReviewItems = new Set();
let reviewSortBy = 'newest';

document.getElementById('btn-review-nav').addEventListener('click', () => { showScreen('review'); selectedReviewItems.clear(); renderReview(); });

function filterReview(filter) {
  currentReviewFilter = filter;
  selectedReviewItems.clear();
  document.querySelectorAll('.review-filter-btn').forEach(btn => {
    const isActive = btn.dataset.filter === filter;
    btn.className = `review-filter-btn px-3 py-1.5 rounded-lg text-sm font-medium ${isActive ? 'bg-accent text-white' : 'bg-gray-100 text-muted'}`;
  });
  renderReview();
}
function sortReview(sortType) { reviewSortBy = sortType; selectedReviewItems.clear(); renderReview(); }
function toggleReviewSelect(id) { if (selectedReviewItems.has(id)) selectedReviewItems.delete(id); else selectedReviewItems.add(id); renderReview(); }

async function batchDeleteSelected() {
  if (selectedReviewItems.size === 0) return;
  for (const id of selectedReviewItems) {
    const item = allData.find(d => d.__backendId === id);
    if (item) await window.dataSdk.delete(item);
  }
  showToast(`已刪除 ${selectedReviewItems.size} 個項目 ✓`);
  selectedReviewItems.clear();
  renderReview();
}

async function batchStarSelected() {
  if (selectedReviewItems.size === 0) return;
  for (const id of selectedReviewItems) {
    const item = allData.find(d => d.__backendId === id);
    if (item) await window.dataSdk.update({ ...item, starred: !item.starred });
  }
  showToast(`已更新 ${selectedReviewItems.size} 個項目 ✓`);
  selectedReviewItems.clear();
  renderReview();
}

function renderReview() {
  const container = document.getElementById('review-content');
  const emptyEl = document.getElementById('review-empty');
  let items = getUserData().filter(d => d.type === 'answer');

  if (currentReviewFilter === 'starred') items = items.filter(d => d.starred);
  else if (currentReviewFilter === 'paraphrase') items = items.filter(d => d.component === 'paraphrase');
  else if (currentReviewFilter === 'grammar') items = items.filter(d => d.component === 'grammar');
  else if (currentReviewFilter === 'vocab') items = items.filter(d => d.component === 'vocab' || d.component === 'vocab_custom');
  else if (currentReviewFilter === 'skeleton') items = items.filter(d => d.component === 'skeleton');
  else if (currentReviewFilter === 'speaking') items = items.filter(d => ['part1','part2','part3'].includes(d.component));

  if (items.length === 0) { container.innerHTML = ''; emptyEl.classList.remove('hidden'); lucide.createIcons(); return; }
  emptyEl.classList.add('hidden');

  if (reviewSortBy === 'newest') items.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
  else if (reviewSortBy === 'oldest') items.sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
  else if (reviewSortBy === 'starred') items.sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0));

  let html = `
    <div class="flex gap-2 mb-3 overflow-x-auto pb-1">
      <button onclick="sortReview('newest')" class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${reviewSortBy === 'newest' ? 'bg-accent text-white' : 'bg-gray-100 text-muted'}">最新優先</button>
      <button onclick="sortReview('oldest')" class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${reviewSortBy === 'oldest' ? 'bg-accent text-white' : 'bg-gray-100 text-muted'}">最舊優先</button>
      <button onclick="sortReview('starred')" class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${reviewSortBy === 'starred' ? 'bg-accent text-white' : 'bg-gray-100 text-muted'}">⭐ 優先</button>
    </div>
  `;

  if (selectedReviewItems.size > 0) {
    html += `
      <div class="bg-indigo-50 rounded-xl p-3 mb-3 flex items-center justify-between">
        <span class="text-sm font-medium text-indigo-700">已選 ${selectedReviewItems.size} 個</span>
        <div class="flex gap-2">
          <button onclick="batchStarSelected()" class="px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 text-xs font-medium hover:bg-amber-200 transition">⭐ 收藏</button>
          <button onclick="batchDeleteSelected()" class="px-3 py-1.5 rounded-lg bg-red-100 text-red-700 text-xs font-medium hover:bg-red-200 transition">🗑️ 刪除</button>
        </div>
      </div>
    `;
  }

  html += '<div class="space-y-3">';
  items.forEach(item => {
    const compLabel = { paraphrase:'改寫', grammar:'Grammar', vocab:'Vocab', vocab_custom:'自訂Vocab', skeleton:'Skeleton', part1:'Part 1', part2:'Part 2', part3:'Part 3 PEEL' }[item.component] || item.component;
    const compColor = { paraphrase:'violet', grammar:'blue', vocab:'emerald', vocab_custom:'indigo', skeleton:'rose', part1:'amber', part2:'orange', part3:'red' }[item.component] || 'gray';
    const date = item.timestamp ? new Date(item.timestamp).toLocaleDateString('zh-HK') : '';
    const isSelected = selectedReviewItems.has(item.__backendId);

    let questionText = '';
    if (item.component === 'paraphrase') { const q = PARAPHRASE_DATA.find(p => p.id === item.question_id); questionText = q ? q.content : ''; }
    else if (item.component === 'grammar') { const q = GRAMMAR_DATA.find(g => g.id === item.question_id); questionText = q ? q.topic : ''; }
    else if (item.component === 'vocab') { const q = VOCAB_DATA.find(v => v.id === item.question_id); questionText = q ? q.content + ' — ' + q.detail : ''; }
    else if (item.component === 'vocab_custom') { questionText = item.question_id + ' — ' + item.user_answer; }
    else if (item.component === 'skeleton') { const q = SKELETON_DATA.find(s => s.id === item.question_id); questionText = q ? q.content.substring(0, 80) + '...' : ''; }
    else if (item.component === 'part1') { const q = PART1_DATA.find(p => p.id === item.question_id); questionText = q ? q.content : ''; }
    else if (item.component === 'part2') { const q = PART2_DATA.find(p => p.id === item.question_id); questionText = q ? q.content.substring(0, 60) + '...' : ''; }
    else if (item.component === 'part3') { const q = PART3_DATA.find(p => p.id === item.question_id); questionText = q ? q.content : ''; }

    let answerPreview = item.user_answer || '';
    if (item.component === 'skeleton' || item.component === 'part3') { try { const parsed = JSON.parse(answerPreview); answerPreview = Object.values(parsed).filter(Boolean).join(' | '); } catch(e) {} }

    html += `
      <div class="bg-surface rounded-xl p-4 shadow-sm cursor-pointer hover:shadow-md transition border-l-4 ${isSelected ? 'border-accent bg-indigo-50' : 'border-transparent'}" onclick="openReviewDetail('${item.__backendId}')">
        <div class="flex items-start justify-between mb-2">
          <div class="flex items-center gap-2 flex-wrap flex-1">
            <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleReviewSelect('${item.__backendId}')" class="w-4 h-4 rounded accent-accent cursor-pointer">
            <span class="tag-pill bg-${compColor}-100 text-${compColor}-700">${compLabel}</span>
            ${item.starred ? '<span class="text-amber-400">⭐</span>' : ''}
          </div>
          <span class="text-xs text-gray-400">${date}</span>
        </div>
        <p class="text-sm font-medium mb-1 line-clamp-2">${questionText}</p>
        ${answerPreview ? `<p class="text-xs text-muted leading-relaxed line-clamp-3 bg-gray-50 rounded-lg p-2 mt-2">${answerPreview}</p>` : ''}
      </div>
    `;
  });
  html += '</div>';
  container.innerHTML = html;
  lucide.createIcons();
}

function openReviewDetail(id) {
  const item = allData.find(d => d.__backendId === id);
  if (!item) return;
  reviewEditingId = id;
  reviewEditingType = item.component;

  let fullQuestion = '';
  if (item.component === 'paraphrase') { const q = PARAPHRASE_DATA.find(p => p.id === item.question_id); fullQuestion = q ? q.content : ''; }
  else if (item.component === 'grammar') { const q = GRAMMAR_DATA.find(g => g.id === item.question_id); fullQuestion = q ? `${q.topic}: ${q.content}` : ''; }
  else if (item.component === 'vocab') { const q = VOCAB_DATA.find(v => v.id === item.question_id); fullQuestion = q ? `${q.content} — ${q.detail}\n"${q.extra}"` : ''; }
  else if (item.component === 'vocab_custom') { fullQuestion = `${item.question_id} — ${item.user_answer}\n${item.notes || ''}`; }
  else if (item.component === 'skeleton') { const q = SKELETON_DATA.find(s => s.id === item.question_id); fullQuestion = q ? q.content : ''; }
  else if (item.component === 'part1') { const q = PART1_DATA.find(p => p.id === item.question_id); fullQuestion = q ? q.content : ''; }
  else if (item.component === 'part2') { const q = PART2_DATA.find(p => p.id === item.question_id); fullQuestion = q ? q.content : ''; }
  else if (item.component === 'part3') { const q = PART3_DATA.find(p => p.id === item.question_id); fullQuestion = q ? q.content : ''; }

  let detailHtml = `
    <div class="fixed inset-0 bg-black/40 z-40 flex items-center justify-center p-4" onclick="if(event.target===this)closeReviewDetail()">
      <div class="bg-surface w-full max-w-lg rounded-2xl p-5 max-h-[85vh] overflow-y-auto shadow-2xl">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold">📚 溫習詳細</h3>
          <button onclick="closeReviewDetail()" class="p-2 hover:bg-gray-100 rounded-lg"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="bg-gray-50 rounded-xl p-3 mb-4">
          <p class="text-xs text-muted font-medium mb-1">📌 題目</p>
          <p class="text-sm leading-relaxed whitespace-pre-line">${fullQuestion}</p>
        </div>
        <div class="bg-blue-50 rounded-xl p-3 mb-4">
          <p class="text-xs text-blue-700 font-medium mb-1">✏️ 你嘅回答</p>
          <textarea id="review-edit-answer" rows="4" class="w-full px-3 py-2 rounded-lg border border-blue-200 bg-white text-sm resize-none font-medium">${item.user_answer || ''}</textarea>
        </div>
        ${item.notes ? `
          <div class="bg-amber-50 rounded-xl p-3 mb-4">
            <p class="text-xs text-amber-700 font-medium mb-1">📝 備註</p>
            <p class="text-sm whitespace-pre-line">${item.notes}</p>
          </div>
        ` : ''}
        <div class="grid grid-cols-3 gap-2 mb-4">
          <button onclick="saveEditedAnswer('${id}')" class="py-2 rounded-lg bg-accent text-white text-xs font-medium hover:bg-indigo-600 transition">💾 保存</button>
          <button onclick="toggleStar('${item.component}','${item.question_id}','${item.category}').then(()=>setTimeout(()=>{renderReview();}, 500))" class="${item.starred ? 'bg-amber-100 text-amber-700' : 'bg-gray-100 text-muted'} py-2 rounded-lg text-xs font-medium transition">
            ${item.starred ? '⭐ 已收藏' : '☆ 收藏'}
          </button>
          <button onclick="deleteReviewAnswer('${id}').then(()=>closeReviewDetail())" class="py-2 rounded-lg bg-red-100 text-red-700 text-xs font-medium hover:bg-red-200 transition">🗑️ 刪除</button>
        </div>
      </div>
    </div>
  `;
  let modalEl = document.getElementById('review-modal');
  if (!modalEl) { modalEl = document.createElement('div'); modalEl.id = 'review-modal'; document.body.appendChild(modalEl); }
  modalEl.innerHTML = detailHtml;
  lucide.createIcons();
}
function closeReviewDetail() { const modal = document.getElementById('review-modal'); if (modal) modal.remove(); reviewEditingId = null; reviewEditingType = null; }
async function saveEditedAnswer(id) {
  const item = allData.find(d => d.__backendId === id);
  if (!item) return;
  const newAnswer = document.getElementById('review-edit-answer').value;
  const r = await window.dataSdk.update({ ...item, user_answer: newAnswer });
  if (r.isOk) { showToast('已保存 ✓'); closeReviewDetail(); renderReview(); }
}
async function deleteReviewAnswer(id) {
  const item = allData.find(d => d.__backendId === id);
  if (!item) return;
  const r = await window.dataSdk.delete(item);
  if (r.isOk) { showToast('已刪除 ✓'); renderReview(); }
}

// ========== MANAGE FUNCTIONS ==========
function showManagePanel(comp) { managingComponent = comp; showScreen('manage-detail'); renderManageDetail(); updateManageCounts(); }
function updateManageCounts() {
  document.getElementById('count-para').textContent = PARAPHRASE_DATA.length + (customQuestions.paraphrase?.length || 0);
  document.getElementById('count-gram').textContent = GRAMMAR_DATA.length + (customQuestions.grammar?.length || 0);
  document.getElementById('count-part1').textContent = PART1_DATA.length + (customQuestions.part1?.length || 0);
  document.getElementById('count-part3').textContent = PART3_DATA.length + (customQuestions.part3?.length || 0);
}
function renderManageDetail() {
  const container = document.getElementById('manage-content');
  const title = document.getElementById('manage-title');
  if (managingComponent === 'paraphrase') {
    title.textContent = 'Paraphrasing - 新增/編輯';
    container.innerHTML = `<div class="space-y-4"><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">原句</label><textarea id="manage-original" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm resize-none" placeholder="Enter the Band 6.0 sentence..."></textarea></div><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">提示 Hint</label><input id="manage-hint" type="text" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm" placeholder="e.g., Try: passive voice + academic vocab"></div><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">參考答案 (可選)</label><textarea id="manage-sample" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm resize-none" placeholder="Sample paraphrase..."></textarea></div><button onclick="addCustomQuestion('paraphrase')" class="w-full py-3 rounded-xl bg-accent text-white font-medium hover:bg-indigo-600 transition">✅ 新增 Paraphrase 題</button></div>`;
  } else if (managingComponent === 'grammar') {
    title.textContent = 'Grammar Focus - 新增/編輯';
    container.innerHTML = `<div class="space-y-4"><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">句式主題</label><input id="manage-topic" type="text" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm" placeholder="e.g., Cleft Sentences"></div><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">規則說明</label><textarea id="manage-rule" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm resize-none" placeholder="Grammar rule..."></textarea></div><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">例句</label><textarea id="manage-example" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm resize-none" placeholder="Example sentence..."></textarea></div><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">練習題</label><textarea id="manage-practice" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm resize-none" placeholder="Practice question..."></textarea></div><button onclick="addCustomQuestion('grammar')" class="w-full py-3 rounded-xl bg-accent text-white font-medium hover:bg-indigo-600 transition">✅ 新增 Grammar 課</button></div>`;
  } else if (managingComponent === 'part1') {
    title.textContent = 'Speaking Part 1 - 新增/編輯';
    container.innerHTML = `<div class="space-y-4"><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">話題分類</label><input id="manage-topic" type="text" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm" placeholder="e.g., Technology, Lifestyle"></div><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">問題</label><textarea id="manage-question" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm resize-none" placeholder="e.g., Do you prefer online or offline learning?"></textarea></div><button onclick="addCustomQuestion('part1')" class="w-full py-3 rounded-xl bg-accent text-white font-medium hover:bg-indigo-600 transition">✅ 新增 Part 1 題</button></div>`;
  } else if (managingComponent === 'part3') {
    title.textContent = 'Speaking Part 3 - 新增/編輯';
    container.innerHTML = `<div class="space-y-4"><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">話題分類</label><input id="manage-topic" type="text" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm" placeholder="e.g., Technology, Environment"></div><div class="bg-surface rounded-xl p-4 shadow-sm"><label class="block text-sm font-medium mb-2">問題</label><textarea id="manage-question" rows="2" class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-surface text-sm resize-none" placeholder="e.g., How does artificial intelligence impact society?"></textarea></div><button onclick="addCustomQuestion('part3')" class="w-full py-3 rounded-xl bg-accent text-white font-medium hover:bg-indigo-600 transition">✅ 新增 Part 3 題</button></div>`;
  }
  lucide.createIcons();
}

function addCustomQuestion(comp) {
  const id = 'custom_' + Date.now();
  let newQ;
 
  if (comp === 'paraphrase') {
    const original = document.getElementById('manage-original').value.trim();
    const hint = document.getElementById('manage-hint').value.trim();
    const sample = document.getElementById('manage-sample').value.trim();
    if (!original || !hint) { showToast('請輸入原句同提示'); return; }
    newQ = { id, content: original, detail: hint, extra: sample };
  } else if (comp === 'grammar') {
    const topic = document.getElementById('manage-topic').value.trim();
    const rule = document.getElementById('manage-rule').value.trim();
    const example = document.getElementById('manage-example').value.trim();
    const practice = document.getElementById('manage-practice').value.trim();
    if (!topic || !rule || !example) { showToast('請輸入主題、規則同例句'); return; }
    newQ = { id, topic, content: rule, detail: example, extra: practice };
  } else if (comp === 'part1' || comp === 'part3') {
    const topic = document.getElementById('manage-topic').value.trim();
    const q = document.getElementById('manage-question').value.trim();
    if (!topic || !q) { showToast('請輸入話題同問題'); return; }
    newQ = { id, topic, content: q };
  }
 
  saveCustomQuestionToDB(comp, newQ);
}

async function saveCustomQuestionToDB(comp, questionData) {
  if (allData.length >= 999) { showToast('已達儲存上限 (999)'); return; }
  
  const result = await window.dataSdk.create({
    type: 'custom_question',
    user: currentUser,
    category: 'custom',
    component: comp,
    question_id: questionData.id,
    user_answer: '',
    starred: false,
    tags: 'custom_question',
    timestamp: new Date().toISOString(),
    notes: '',
    score: 0,
    custom_data: JSON.stringify(questionData)
  });
  
  if (result.isOk) {
    showToast(`已新增 ${comp} 題 ✅`);
    updateManageCounts();
  }
}

function deleteCustomQuestion(comp, id) {
  const record = allData.find(d => d.type === 'custom_question' && d.user === currentUser && d.component === comp && d.question_id === id);
  if (record) {
    window.dataSdk.delete(record).then(() => { showToast('已刪除 ✓'); updateManageCounts(); });
  }
}

// ========== DATA SDK INIT ==========
(async () => {
  const r = await window.dataSdk.init(dataHandler);
  if (!r.isOk) console.error('Data SDK init failed');
  
  // 啟動時自動去 Google Sheet 拉題目
  await loadQuestionsFromGoogleSheet(); 
  
  lucide.createIcons();
  updateManageCounts();
})();
</script>
